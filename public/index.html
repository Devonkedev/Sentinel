<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinel</title>
  <meta name="description" content="Sentinel: the public missing board and case console of the Extradigital Exceptions and Unknowns Network.">
  <meta name="theme-color" content="#e8e2d4">
  <link rel="icon" href="brand/mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try {
      var t = localStorage.getItem("sentinel_theme");
      document.documentElement.dataset.theme = t || "light";
    } catch (e) { document.documentElement.dataset.theme = "light"; }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
