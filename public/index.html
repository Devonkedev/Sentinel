<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EXUN Sentinel</title>
  <meta name="description" content="Report sightings and investigate extradigital anomalies with the Extradigital Exceptions and Unknowns Network.">
  <meta name="theme-color" content="#0a0d14">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234c8dff'/%3E%3Cpath d='M16 26s7-3.5 7-8.75V11l-7-2.6L9 11v6.25C9 22.5 16 26 16 26z' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try {
      var t = localStorage.getItem("exun_theme");
      document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    } catch (e) { document.documentElement.dataset.theme = "dark"; }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
